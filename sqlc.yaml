version: "2"
sql:
  - engine: "postgresql"
    # Канонический DDL (без down-секций) — надёжный источник схемы для sqlc.
    # Миграции tern (migrations/001_init.sql) его зеркалят.
    schema: "docs/schema.sql"
    queries: "internal/postgres/sqlc/query"
    gen:
      go:
        package: "sqlc"
        out: "internal/postgres/sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
