# tern migration config. Значения подставляются из переменных окружения.
# Запуск: tern migrate --migrations ./migrations --config ./migrations/tern.conf
# (Makefile прокидывает нужные DB_* из .env / docker-compose.)

[database]
host = {{ env "DB_HOST" }}
port = {{ env "DB_PORT" }}
database = {{ env "DB_NAME" }}
user = {{ env "DB_USER" }}
password = {{ env "DB_PASSWORD" }}
sslmode = {{ env "DB_SSLMODE" }}
version_table = public.schema_version
