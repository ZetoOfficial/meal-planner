# tern migration config. Значения подставляются из переменных окружения (${VAR}).
# Запуск: tern migrate --migrations ./migrations --config ./migrations/tern.conf
# (Makefile прокидывает нужные DB_* из .env / docker-compose.)

[database]
host = ${DB_HOST}
port = ${DB_PORT}
database = ${DB_NAME}
user = ${DB_USER}
password = ${DB_PASSWORD}
sslmode = ${DB_SSLMODE}
version_table = public.schema_version
