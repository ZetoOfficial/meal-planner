version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard
  enable:
    # correctness (было)
    - bodyclose
    - copyloopvar
    - errorlint
    - gocheckcompilerdirectives
    - gocritic
    - gosec
    - misspell
    - nilerr
    - prealloc
    - revive
    - unconvert
    - unparam
    - whitespace
    # architecture boundaries (форсим правило зависимостей из CLAUDE.md)
    - depguard
    # complexity / size caps (не даём LLM писать простыни)
    - cyclop
    - funlen
    - gocognit
    - nestif
    - nakedret
    # style discipline
    - forbidigo
    - godot
    - godox
    - mnd
    - perfsprint
    - usestdlibvars
    - wastedassign
    - reassign
    - predeclared
    # context discipline (API + DB сервис)
    - noctx
    - contextcheck
    - containedctx
    # global state hygiene
    - gochecknoinits
    - gochecknoglobals
    # test hygiene
    - thelper
    - tparallel

  settings:
    revive:
      rules:
        - name: var-naming
        - name: indent-error-flow
        - name: superfluous-else
        - name: unreachable-code
        - name: redefines-builtin-id

    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style
      disabled-checks:
        - ifElseChain
        - hugeParam

    gosec:
      excludes:
        - G304

    errorlint:
      errorf: true
      asserts: true
      comparison: true

    depguard:
      rules:
        # Core: домен, солвер, оценщик качества — чистая доменная логика.
        # Не должны знать ни про HTTP/OpenAPI, ни про БД, ни про LLM, ни про usecase.
        core:
          list-mode: lax
          files:
            - '**/internal/domain/**'
            - '**/internal/solver/**'
            - '**/internal/quality/**'
          deny:
            - pkg: github.com/ZetoOfficial/meal-planner/internal/api
              desc: core must not import HTTP/OpenAPI adapters
            - pkg: github.com/ZetoOfficial/meal-planner/internal/postgres
              desc: core must not import Postgres/sqlc adapters
            - pkg: github.com/ZetoOfficial/meal-planner/internal/llm
              desc: core must not import LLM provider adapters
            - pkg: github.com/ZetoOfficial/meal-planner/internal/usecase
              desc: dependencies point inward — core must not import usecase
            - pkg: github.com/jackc/pgx
              desc: core must not import the DB driver
            - pkg: net/http
              desc: core must not do HTTP
            - pkg: database/sql
              desc: core must not touch SQL
        # Usecase: оркестрация через порты. Порты определяются здесь, адаптеры их реализуют.
        # Не должен импортировать конкретные адаптеры.
        usecase:
          list-mode: lax
          files:
            - '**/internal/usecase/**'
          deny:
            - pkg: github.com/ZetoOfficial/meal-planner/internal/api
              desc: usecase must not import HTTP/OpenAPI adapters
            - pkg: github.com/ZetoOfficial/meal-planner/internal/postgres
              desc: usecase must depend on ports, not the Postgres adapter
            - pkg: github.com/ZetoOfficial/meal-planner/internal/llm
              desc: usecase must depend on ports, not the LLM adapter
            - pkg: github.com/jackc/pgx
              desc: usecase must not import the DB driver
            - pkg: net/http
              desc: usecase must not do HTTP

    cyclop:
      max-complexity: 15
      package-average: 0

    funlen:
      lines: 80
      statements: 60
      ignore-comments: true

    gocognit:
      min-complexity: 25

    nestif:
      min-complexity: 5

    nakedret:
      max-func-lines: 30

    godox:
      keywords:
        - FIXME
        - HACK

    mnd:
      ignored-numbers:
        - "0"
        - "1"
        - "2"
        - "3"
      ignored-functions:
        - strconv.ParseInt
        - strconv.ParseFloat
        - make

    forbidigo:
      forbid:
        - pattern: ^fmt\.Print.*$
          msg: use the structured logger instead of fmt.Print
        - pattern: ^print(ln)?$
          msg: use the structured logger instead of builtin print

  exclusions:
    generated: strict
    presets:
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Тесты: послабляем шумные для табличных тестов линтеры.
      - path: _test\.go
        linters:
          - gosec
          - errcheck
          - unparam
          - revive
          - funlen
          - gocognit
          - cyclop
          - nestif
          - mnd
          - containedctx
          - noctx
          - dupl
      - path: _test\.go
        text: "filepathJoin:"
      # main / composition root: глобалы и init допустимы.
      - path: cmd/
        linters:
          - gochecknoinits
          - gochecknoglobals
      - path: internal/app/
        linters:
          - gochecknoinits
          - gochecknoglobals
      # HTTP mapping mirrors the anonymous structs oapi-codegen generates, so
      # their field names are fixed by the contract rather than by us.
      - path: internal/api/http/
        linters:
          - revive
        text: "var-naming: struct field"

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/ZetoOfficial/meal-planner

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
