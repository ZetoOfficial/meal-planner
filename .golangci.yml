version: "2"

run:
  timeout: 3m
  tests: true

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gocheckcompilerdirectives
    - gocritic
    - gosec
    - misspell
    - nilerr
    - prealloc
    - revive
    - unconvert
    - unparam
    - whitespace

  settings:
    revive:
      rules:
        - name: var-naming
        - name: indent-error-flow
        - name: superfluous-else
        - name: unreachable-code
        - name: redefines-builtin-id

    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style
      disabled-checks:
        - ifElseChain
        - hugeParam

    gosec:
      excludes:
        - G304

    errorlint:
      errorf: true
      asserts: true
      comparison: true

  exclusions:
    presets:
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - gosec
          - errcheck
          - unparam
          - revive
      - path: _test\.go
        text: "filepathJoin:"
      - path: cmd/
        linters:
          - gochecknoinits
          - gochecknoglobals

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/ZetoOfficial/meal-planner

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
